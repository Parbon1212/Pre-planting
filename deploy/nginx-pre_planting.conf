server {
    listen 80;
    listen [::]:80;
    server_name ftbc-public1.ffpri.go.jp;

    server_tokens off;
    charset utf-8;
    access_log /var/log/nginx/pre_planting.access.log;
    error_log /var/log/nginx/pre_planting.error.log warn;

    location = /pre_planting {
        return 308 /pre_planting/;
    }

    location ~* ^/pre_planting/(?:.*/)?\.[^/]* {
        deny all;
    }

    location /pre_planting/ {
        root /var/www;
        index index.html;
        autoindex off;
        limit_except GET HEAD {
            deny all;
        }
        try_files $uri $uri/ =404;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' https://unpkg.com https://fonts.googleapis.com; style-src-elem 'self' https://unpkg.com https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://cyberjapandata.gsi.go.jp https://unpkg.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' blob: data: https://cyberjapandata.gsi.go.jp; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    }
}